<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),startupImage=document.getElementById('startupImage'),N=64,MAXF=20000;
let bands=Array.from({length:N},(_,i)=>[i*MAXF/N,(i+1)*MAXF/N]);
let maxima=[],instant=[],running=false,audioCtx=null,analyser=null,source=null,data=null,raf=0,overlays=[];
const $=id=>document.getElementById(id);
function resetData(){maxima=new Array(bands.length).fill(0);instant=new Array(bands.length).fill(0);draw();}
resetData();
function fmt(x){return Number.isInteger(x)?String(x):String(Math.round(x*1000)/1000)}
function fmtHz(x){if(!Number.isFinite(x)||x===0)return '0'; const a=Math.abs(x); const p=Math.pow(10,Math.floor(Math.log10(a))-1); const r=Math.round(x/p)*p; let s=String(r); if(Math.abs(r)>=1000)s=s.replace(/\B(?=(\d{3})+(?!\d))/g,' '); return s;}
function renderBands(){let s=bands.map(b=>fmt(b[0])+',   '+fmt(b[1])).join('\n');$('bandText').value=s; $('bandList').innerHTML=''; bands.forEach((b,i)=>{let d=document.createElement('div');d.className='bandline';d.innerHTML='<span style="width:38px">'+(i+1)+'</span><input inputmode="decimal" value="'+fmt(b[0])+'"><span>,&nbsp;&nbsp;&nbsp;</span><input inputmode="decimal" value="'+fmt(b[1])+'">';$('bandList').appendChild(d)});}
$('edit').onclick=()=>{let p=$('bands');p.style.display=p.style.display==='block'?'none':'block';if(p.style.display==='block'){renderBands();setTimeout(()=>p.scrollIntoView({behavior:'smooth',block:'center'}),80);}};
$('default').onclick=()=>{bands=Array.from({length:N},(_,i)=>[i*MAXF/N,(i+1)*MAXF/N]);resetData();renderBands();};
$('apply').onclick=()=>{let nb=[];document.querySelectorAll('.bandline').forEach(d=>{let x=d.querySelectorAll('input');let a=parseFloat(x[0].value),b=parseFloat(x[1].value);if(Number.isFinite(a)&&Number.isFinite(b))nb.push([a,b])});if(!nb.length)return alert('Enter at least one valid band.');nb.sort((a,b)=>a[0]-b[0]);for(let i=0;i<nb.length;i++){nb[i][0]=Math.max(0,Math.min(MAXF,nb[i][0]));nb[i][1]=Math.max(0,Math.min(MAXF,nb[i][1]));if(i&&nb[i][0]<=nb[i-1][1])nb[i][0]=nb[i-1][1]+1;if(nb[i][1]<=nb[i][0])nb[i][1]=Math.min(MAXF,nb[i][0]+1)}nb=nb.filter(b=>b[1]>b[0]&&b[0]<MAXF);if(!nb.length)return alert('No usable bands.');bands=nb;resetData();renderBands();$('status').textContent='0–20,000 Hz · '+bands.length+' bands';};
function angleFor(f){return -Math.PI/2+(f/MAXF)*Math.PI*2}
function normEnergy(k,fftSize,sr){let ny=sr/2, bw=ny/data.length, sum=0,w=0;let [a,b]=bands[k];for(let i=0;i<data.length;i++){let lo=i*bw,hi=(i+1)*bw,ov=Math.max(0,Math.min(b,hi)-Math.max(a,lo));if(ov){sum+=(data[i]/255)*ov;w+=ov}}return w?sum/w:0}
function drawGrid(cx,cy,R){
ctx.save();ctx.translate(cx,cy);
ctx.strokeStyle='rgba(180,180,180,.25)';ctx.lineWidth=3;
for(let d=0;d<360;d+=60){let a=d*Math.PI/180-Math.PI/2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*R,Math.sin(a)*R);ctx.stroke();}
ctx.strokeStyle='rgba(255,255,255,.18)';[.25,.5,.75,1].forEach(q=>{ctx.beginPath();ctx.arc(0,0,R*q,0,Math.PI*2);ctx.stroke()});
// Angle labels: ALWAYS degrees. They are independent of the frequency labels.
ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='bold 18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
for(let d=0;d<360;d+=60){let a=d*Math.PI/180-Math.PI/2,lr=R+30;ctx.fillText(d+'°',Math.cos(a)*lr,Math.sin(a)*lr);}
ctx.restore();
// Frequency labels: every 5th frequency band, in Hz, placed at that band's midpoint.
ctx.save();ctx.fillStyle='rgba(120,190,255,.95)';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
for(let i=4;i<bands.length;i+=5){let f=(bands[i][0]+bands[i][1])/2,a=angleFor(f),lr=R+18;ctx.fillText(fmtHz(f)+' Hz',cx+Math.cos(a)*lr,cy+Math.sin(a)*lr);}
ctx.restore();
}
function draw(){let startup=!running&&maxima.every(v=>v===0)&&overlays.length===0;if(startup){startupImage.style.display='block';cv.style.display='none';return;}startupImage.style.display='none';cv.style.display='block';let w=cv.width,h=cv.height,cx=w/2,cy=h/2,R=Math.min(w,h)*.43;ctx.clearRect(0,0,w,h);ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);drawGrid(cx,cy,R);let base=R*.08,maxR=R*.84; // startup example

// Startup illustration: representative adult-male voiced vowel spectrum, using published formant regions (F1≈270 Hz, F2≈2300 Hz, F3≈3000 Hz).
// Red = averaged voice envelope; Blue = one instantaneous harmonic snapshot.

const mids=bands.map(b=>(b[0]+b[1])/2);
const redVals=mids.map(f=>Math.min(1,voiceEnv(f)));
for(let i=0;i<mids.length;i++){
 let f=mids[i],a=angleFor(f),rr=base+redVals[i]*maxR;
 if(redVals[i]>.04){ctx.strokeStyle='#e33';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(cx+Math.cos(a-.025)*rr,cy+Math.sin(a-.025)*rr);ctx.lineTo(cx+Math.cos(a+.025)*rr,cy+Math.sin(a+.025)*rr);ctx.stroke();}
}
// A single plausible instantaneous harmonic snapshot of the same voice.
for(let i=0;i<mids.length;i++){
 let f=mids[i],a=angleFor(f),harm=(0.12+0.88*Math.abs(Math.sin(f/83.7))**7)*Math.exp(-f/3900),v=Math.min(1,voiceEnv(f)*harm*2.45+0.04*gauss(f,900,300));
 let rr=base+v*maxR;
 if(v>.025){ctx.strokeStyle='#28f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*base,cy+Math.sin(a)*base);ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);ctx.stroke();}
}
}
if(!running&&maxima.every(v=>v===0)&&overlays.length===0){
ctx.save();
ctx.fillStyle='#10192b';ctx.beginPath();ctx.arc(cx,cy,R*.30,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#eee';ctx.font='bold 28px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('freq_log',cx,cy-18);
ctx.fillStyle='#aeb6c5';ctx.font='18px Arial';ctx.fillText('Startup example',cx,cy+22);
ctx.restore();
}
for(let i=0;i<bands.length;i++){let mid=(bands[i][0]+bands[i][1])/2,a=angleFor(mid);let ri=base+(instant[i]||0)*maxR; if(running&&ri>base){ctx.strokeStyle='#28f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*base,cy+Math.sin(a)*base);ctx.lineTo(cx+Math.cos(a)*ri,cy+Math.sin(a)*ri);ctx.stroke()}let rm=base+(maxima[i]||0)*maxR;if(rm>base){ctx.strokeStyle='#e33';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(cx+Math.cos(a-.025)*rm,cy+Math.sin(a-.025)*rm);ctx.lineTo(cx+Math.cos(a+.025)*rm,cy+Math.sin(a+.025)*rm);ctx.stroke()}}
for(const o of overlays){for(let i=0;i<o.bands.length;i++){let b=o.bands[i],v=o.maxima[i]||0,a=angleFor((b[0]+b[1])/2),rr=base+v*maxR;ctx.strokeStyle=o.color;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(cx+Math.cos(a-.025)*rr,cy+Math.sin(a-.025)*rr);ctx.lineTo(cx+Math.cos(a+.025)*rr,cy+Math.sin(a+.025)*rr);ctx.stroke()}}}
async function startMic(){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();let stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});source=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=4096;analyser.smoothingTimeConstant=.15;source.connect(analyser);data=new Uint8Array(analyser.frequencyBinCount);running=true;$('mic').textContent='⏹ STOP';$('mic').className='stop';loop();}catch(e){alert('Microphone error: '+e.message)}}
function stopMic(){running=false;if(source)source.mediaStream?.getTracks().forEach(t=>t.stop());if(audioCtx)audioCtx.close();source=null;analyser=null;cancelAnimationFrame(raf);$('mic').textContent='🎤 START MIC';$('mic').className='start';draw()}
function loop(){if(!running)return;analyser.getByteFrequencyData(data);for(let i=0;i<bands.length;i++){let v=normEnergy(i,analyser.fftSize,audioCtx.sampleRate);instant[i]=v;if(v>maxima[i])maxima[i]=v}draw();raf=requestAnimationFrame(loop)}
$('mic').onclick=()=>running?stopMic():startMic();$('reset').onclick=()=>{if(running)stopMic();resetData();};
$('save').onclick=async()=>{if(!maxima.some(v=>v>0))return alert('No maximum data to save yet. Start the microphone first.');let color=prompt('Dash color (CSS name or hex):','#ff3333');if(!color)return;let obj={type:'frequency-spectrum-maxima',version:1,maxFrequency:MAXF,color,created:new Date().toISOString(),bands,maxima};let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});if(window.showSaveFilePicker){try{let h=await showSaveFilePicker({suggestedName:'frequency_maximums.json',types:[{description:'Frequency maximums',accept:{'application/json':['.json']}}]});let w=await h.createWritable();await w.write(blob);await w.close();return}catch(e){if(e.name==='AbortError')return}}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='frequency_maximums.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('overlay').onclick=()=>$('files').click();$('files').onchange=async e=>{for(const f of e.target.files){try{let o=JSON.parse(await f.text());if(o.type==='frequency-spectrum-maxima'&&Array.isArray(o.bands)&&Array.isArray(o.maxima))overlays.push(o)}catch{}}e.target.value='';draw()};
draw();
</script></body></html>
