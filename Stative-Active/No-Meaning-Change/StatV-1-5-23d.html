<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StatV 1-5 — forma prosta czy -ing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --board-bg:#6b3a28; --board-bg-2:#8a4f34; --board-frame:#4a3324; --board-frame-dark:#2e2016;
  --chalk:#f5ead9; --card-bg:#fdfaf3; --card-line:#e6dcc8; --ink:#2b2b26; --ink-soft:#78766a;
  --red-pen:#d1483a; --pen-green:#4f8f5e;
  --font-display:'Kalam',cursive; --font-body:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-body); color:var(--ink);
  background:radial-gradient(120% 90% at 50% 0%, var(--board-bg-2) 0%, var(--board-bg) 60%, #5b3122 100%);
  min-height:100vh; padding:10px 12px 28px;
}
body.busy .lockable{pointer-events:none}

/* phone-first, but bounded: above ~560px the column stops growing and centres,
   or a tile for the word "know" ends up half a tablet wide */
.wrap{max-width:560px; margin:0 auto}

.title{
  font-family:var(--font-display); font-weight:700; color:var(--chalk);
  font-size:25px; line-height:1.15; text-align:center; margin:2px 0 10px;
  text-shadow:0 1px 0 rgba(0,0,0,.25);
}
.bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; margin:0 0 11px}
.btn{
  font-family:var(--font-body); font-size:15px; font-weight:600;
  min-height:44px; padding:0 16px; border-radius:10px; cursor:pointer;
  border:2px solid var(--board-frame-dark); background:var(--card-bg); color:var(--ink);
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
}
.btn[hidden]{display:none}
.btn.icon{min-width:44px; padding:0 10px}

.pill{
  position:fixed; left:50%; top:8px; transform:translateX(-50%);
  background:var(--board-frame-dark); color:var(--chalk);
  font-size:14px; font-weight:600; padding:9px 18px; border-radius:999px;
  box-shadow:0 3px 10px rgba(0,0,0,.35); z-index:50;
}
.pill[hidden]{display:none}

.items{display:flex; flex-direction:column; gap:9px}
.item{
  background:var(--card-bg); border:2px solid var(--board-frame); border-radius:11px;
  padding:10px 10px 11px;
}
.item.done{border-color:var(--pen-green); background:#eef6f0}
.line{font-size:16px; line-height:1.9}
.num{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); margin-right:6px; vertical-align:2px}
.gap{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:100px; min-height:34px; padding:0 8px; margin:0 2px;
  border-bottom:2px solid var(--card-line); vertical-align:middle; font-weight:700;
}
.item.done .gap{border-bottom-color:var(--pen-green); color:#2f5f3c}

.opts{display:flex; gap:8px; margin:9px 0 0}
.opts[hidden]{display:none}
.opt{
  flex:1 1 0; min-width:0;
  font-family:var(--font-body); font-size:15px; font-weight:600;
  min-height:44px; padding:0 8px; border-radius:9px; cursor:pointer;
  border:2px solid var(--board-frame); background:#fff; color:var(--ink);
  display:inline-flex; align-items:center; justify-content:center;
  overflow-wrap:anywhere; text-align:center;
}
/* the shake and the red blink ride in ONE keyframe so they cannot drift apart (§4.9) */
@keyframes wrong{
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-6px)} 30%{transform:translateX(6px)}
  45%{transform:translateX(-4px)} 60%{transform:translateX(4px)} 75%{transform:translateX(-2px)}
  18%,55%{border-color:var(--red-pen); background:#fbe9e6; color:#8d2f24}
}
.opt.wrong{animation:wrong .44s ease-in-out}

.status{text-align:center; color:var(--chalk); font-size:13px; min-height:19px; margin:12px 0 0; opacity:.9}
.done-card{
  text-align:center; margin:12px 0 0; color:var(--chalk);
  font-family:var(--font-display); font-size:25px; font-weight:700;
}
.done-card[hidden]{display:none}
noscript p{background:var(--card-bg); border-radius:10px; padding:12px; margin:12px 0; font-size:14px; text-align:center}
</style>
</head>
<body>

<div class="wrap">

<h1 class="title">Wstaw właściwą formę · 1–5</h1>

<noscript><p>Ta strona potrzebuje JavaScriptu. Bez niego zobaczysz tylko tytuł i to zdanie —
otwórz plik w przeglądarce z włączonym JavaScriptem.</p></noscript>

<div class="bar lockable">
  <button class="btn icon" id="sound" type="button" aria-label="Dźwięk"></button>
  <button class="btn" id="again" type="button">Jeszcze raz</button>
</div>

<div class="items lockable" id="items"></div>

<p class="status" id="status"></p>
<p class="done-card" id="done" hidden>Brawo! 🎉</p>

</div>

<div class="pill" id="pill" hidden>Czytam…</div>

<script>
(function(){
'use strict';

/* ============================================================
   DATA — five stative verbs (ranks 1-5) and five plainly dynamic ones.
   Each sentence carries its own two tiles: the verb with -ing and without.

   The STATIVE sentences are written so the -ing tile is ungrammatical, not
   merely unusual — "My sister is being a teacher" is wrong, whereas
   "She is being quiet" would be the dual-behaviour point this unit leaves out.

   The DYNAMIC sentences all carry a now-signal (Look! / Listen! / Be quiet! /
   at the moment / right now), so the plain tile is wrong for THIS sentence
   even though it is a fine habitual sentence on its own. That is exactly what
   the distractor is there to teach, and it is why the plain form must carry
   its own -s: `watches`, `runs`, `writes`.
   ============================================================ */
var ITEMS = [
  {before:"My sister ", after:" a teacher.", plain:"is", ing:"is being", stative:true},
  {before:"I ", after:" enough time.", plain:"have", ing:"am having", stative:true},
  {before:"They ", after:" the answer.", plain:"know", ing:"are knowing", stative:true},
  {before:"I ", after:" you are right.", plain:"think", ing:"am thinking", stative:true},
  {before:"I ", after:" a boat in the distance.", plain:"see", ing:"am seeing", stative:true},
  {before:"Listen! The children ", after:" in the garden.", plain:"play", ing:"are playing", stative:false},
  {before:"Be quiet! Dad ", after:" the news.", plain:"watches", ing:"is watching", stative:false},
  {before:"Look! The dog ", after:" after the cat.", plain:"runs", ing:"is running", stative:false},
  {before:"We ", after:" dinner at the moment.", plain:"eat", ing:"are eating", stative:false},
  {before:"She ", after:" an email right now.", plain:"writes", ing:"is writing", stative:false}
];

/* a stative verb takes the plain form; a dynamic one in a now-context takes -ing */
function answerOf(it){ return it.stative ? it.plain : it.ing; }
function sentenceOf(it){ return it.before + answerOf(it) + it.after; }

var SPOKEN = {};
function spoken(t){ return SPOKEN[t] || t; }

/* ============================================================
   VOICES (§5.4) — en-GB first, English only, never the whole list
   ============================================================ */
var maleVoice=null, femaleVoice=null, englishVoice=null;
function refreshVoices(){
  var all=[];
  try{ all = (window.speechSynthesis && speechSynthesis.getVoices()) || []; }catch(e){ all=[]; }
  var gb = all.filter(function(v){ return /^en[-_]GB/i.test(v.lang||''); });
  var en = all.filter(function(v){ return /^en/i.test(v.lang||''); });
  var voices = gb.length ? gb : en;
  englishVoice = voices[0] || null;
  maleVoice = voices.filter(function(v){ return /male/i.test(v.name) && !/female/i.test(v.name); })[0] || null;
  femaleVoice = voices.filter(function(v){ return /female/i.test(v.name); })[0] || null;
}
refreshVoices();
try{ if(window.speechSynthesis) speechSynthesis.onvoiceschanged = refreshVoices; }catch(e){}

var soundOn = true;
var speakCount = 0;

/* onDone fires exactly once in every case — sound off, no engine, a throw, and
   the Android builds where `onend` never arrives (§4.7). The board waits on it. */
function speak(text, onDone){
  var done = false;
  function fire(){ if(done) return; done = true; try{ onDone && onDone(); }catch(e){} }
  if(!soundOn || !text){ setTimeout(fire, 0); return; }
  var synth = null;
  try{ synth = window.speechSynthesis || null; }catch(e){ synth = null; }
  if(!synth || typeof SpeechSynthesisUtterance === 'undefined'){ setTimeout(fire, 0); return; }
  try{ synth.cancel(); }catch(e){}
  var u;
  try{ u = new SpeechSynthesisUtterance(spoken(text)); }catch(e){ setTimeout(fire, 0); return; }
  u.lang = 'en-GB';
  speakCount++;
  var wantMale = (speakCount % 2) === 1;
  var pick = wantMale ? (maleVoice || englishVoice) : (femaleVoice || maleVoice || englishVoice);
  try{ if(pick) u.voice = pick; }catch(e){}      /* throws on Android when the list is rebuilt */
  if(!maleVoice || !femaleVoice) u.pitch = wantMale ? 0.8 : 1.2;
  u.onend = fire;
  u.onerror = fire;
  setTimeout(fire, Math.min(8000, 1200 + String(text).length * 90));
  try{ synth.speak(u); }catch(e){ fire(); }
}

/* a bonus ON TOP of the visual, never the only signal — absent on most
   tablets, ignored by some browsers, and it throws in a few (§4.9) */
function buzz(){ try{ if(navigator.vibrate) navigator.vibrate([35, 45, 35]); }catch(e){} }

/* ============================================================
   STATE
   ============================================================ */
var order = [];        // the sentences, shuffled
var sides = {};        // item index -> true when the -ing tile is on the left
var solved = {};
var busy = false;

var itemsEl = document.getElementById('items');
var pill = document.getElementById('pill');
var statusEl = document.getElementById('status');
var doneEl = document.getElementById('done');
var soundBtn = document.getElementById('sound');
var againBtn = document.getElementById('again');

function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

function deal(){
  order = shuffle(ITEMS.map(function(_, i){ return i; }));   // the sentences shuffle …
  sides = {};
  ITEMS.forEach(function(_, i){ sides[i] = Math.random() < 0.5; });  // … and so does each pair,
  solved = {};                                  // so the answer is never learnable by position
  busy = false;                                 // a fresh deal must clear it, or a reload lands frozen
  document.body.classList.remove('busy');
  pill.hidden = true;
  doneEl.hidden = true;
  statusEl.textContent = '';
  render();
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  itemsEl.textContent = '';
  order.forEach(function(idx, row){
    var it = ITEMS[idx];
    var box = document.createElement('div');
    box.className = 'item' + (solved[idx] ? ' done' : '');

    var line = document.createElement('p');
    line.className = 'line';
    var n = document.createElement('span');
    n.className = 'num';
    n.textContent = (row + 1) + '.';
    line.appendChild(n);
    /* emit the leading text only when there IS any, or the sentence renders
       with a stray space in front of the blank (§4.9) */
    if(it.before) line.appendChild(document.createTextNode(it.before));
    var gap = document.createElement('span');
    gap.className = 'gap';
    gap.textContent = solved[idx] ? answerOf(it) : '';
    line.appendChild(gap);
    line.appendChild(document.createTextNode(it.after));
    box.appendChild(line);

    var opts = document.createElement('div');
    opts.className = 'opts';
    opts.hidden = !!solved[idx];                 // the tiles go once the gap is filled
    var pair = sides[idx] ? [it.ing, it.plain] : [it.plain, it.ing];
    pair.forEach(function(form){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      b.textContent = form;
      b.dataset.item = String(idx);
      b.dataset.form = form;
      opts.appendChild(b);
    });
    box.appendChild(opts);
    itemsEl.appendChild(box);
  });
}

function speakerSvg(){
  return '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">' +
    '<path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4z"/>' +
    '<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
}
function mutedSvg(){
  return '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">' +
    '<path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4z"/>' +
    '<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/></svg>';
}
function paintSound(){ soundBtn.innerHTML = soundOn ? speakerSvg() : mutedSvg(); }

/* ============================================================
   CHOOSING — a right tile fills the gap and reads the whole sentence;
   a wrong one shakes, blinks red and costs nothing (§4.9)
   ============================================================ */
function choose(idx, form, btn){
  if(busy || solved[idx]) return;
  var it = ITEMS[idx];
  if(form !== answerOf(it)){
    if(btn){ btn.classList.add('wrong'); setTimeout(function(){ btn.classList.remove('wrong'); }, 460); }
    buzz();
    return;
  }
  solved[idx] = true;
  /* the lock starts here, not when the reading does — the gap between the two
     is otherwise open for a tap to start something else (§4.6) */
  busy = true;
  document.body.classList.add('busy');
  pill.hidden = false;
  render();
  speak(sentenceOf(it), function(){
    busy = false;
    document.body.classList.remove('busy');
    pill.hidden = true;
    render();
    if(Object.keys(solved).length === ITEMS.length) doneEl.hidden = false;
  });
}

itemsEl.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('.opt') : null;
  if(!b) return;
  choose(parseInt(b.dataset.item, 10), b.dataset.form, b);
});

soundBtn.addEventListener('click', function(){ if(busy) return; soundOn = !soundOn; paintSound(); });
againBtn.addEventListener('click', function(){ if(!busy) deal(); });

paintSound();
deal();

/* exposed for the automated checks only */
window.__ex = {
  items: function(){ return ITEMS; },
  order: function(){ return order; },
  solved: function(){ return solved; },
  isBusy: function(){ return busy; },
  answerOf: answerOf,
  sentenceOf: sentenceOf,
  choose: choose,
  deal: deal
};
})();
</script>
</body>
</html>
