<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opisywanie domów — wybierz słowo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --board-bg:#6b3a28; --board-bg-2:#8a4f34; --board-frame:#4a3324; --board-frame-dark:#2e2016;
  --chalk:#f5ead9; --card-bg:#fdfaf3; --card-line:#e6dcc8; --ink:#2b2b26; --ink-soft:#78766a;
  --red-pen:#d1483a; --red-pen-dark:#a3392b; --pen-green:#4f8f5e; --answer-blue:#1d4ed8;
  --font-display:'Kalam',cursive; --font-body:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{overflow-x:hidden;}
body{margin:0;background:var(--board-frame-dark);font-family:var(--font-body);color:var(--ink);}
.board{max-width:620px;margin:0 auto;padding:12px 8px 28px;background:linear-gradient(160deg,var(--board-bg),var(--board-bg-2));min-height:100vh;}
.frame{border:7px solid var(--board-frame);border-radius:14px;box-shadow:0 0 0 3px var(--board-frame-dark),0 14px 30px rgba(0,0,0,.4);padding:12px 9px 20px;}
.title{font-family:var(--font-display);color:var(--chalk);font-size:clamp(1.2rem,5.4vw,1.7rem);text-align:center;margin:2px 0 1px;text-shadow:0 2px 0 rgba(0,0,0,.25);line-height:1.25;}
.subtitle{text-align:center;color:var(--chalk);opacity:.9;font-size:clamp(.84rem,3.6vw,1rem);font-weight:600;margin:0 0 11px;}
.statusbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--font-mono);
  font-size:clamp(.74rem,3.1vw,.85rem);color:var(--chalk);margin:0 2px 9px;}
.sound-toggle{display:inline-flex;align-items:center;gap:5px;cursor:pointer;}
.sound-toggle input{width:17px;height:17px;}
.btn{font-family:var(--font-body);font-weight:600;font-size:.88rem;border:none;border-radius:20px;
  padding:11px 22px;min-height:44px;cursor:pointer;background:var(--board-bg-2);color:var(--chalk);
  display:inline-flex;align-items:center;justify-content:center;gap:7px;}
.btn:active{transform:translateY(1px);}
.btn.secondary{background:var(--card-line);color:var(--ink);}
.btn[disabled]{opacity:.4;cursor:default;}
.actions{display:flex;gap:9px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.done{text-align:center;font-family:var(--font-display);font-size:clamp(1.4rem,6vw,1.9rem);
  color:var(--pen-green);margin:10px 0 2px;text-shadow:0 2px 0 rgba(255,255,255,.55);}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

.card{background:var(--card-bg);border:1px solid var(--card-line);border-radius:12px;
  padding:18px 13px 15px;margin-bottom:11px;}
.num{text-align:center;color:var(--ink-soft);font-family:var(--font-mono);
  font-size:clamp(.72rem,3vw,.8rem);margin-bottom:7px;}
.sentence{text-align:center;font-size:clamp(1rem,4.3vw,1.22rem);line-height:1.55;font-weight:600;}
.blank{display:inline-block;min-width:5.6em;border-bottom:2px solid var(--board-bg-2);
  text-align:center;color:var(--ink-soft);font-family:var(--font-mono);}
.card.ok .blank{border-bottom-color:var(--pen-green);color:var(--pen-green);}
.card.ok{border-color:var(--pen-green);background:#f2faf4;}
.tiles{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap;}
.tile{flex:1 1 0;min-width:130px;min-height:52px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-family:var(--font-mono);font-size:clamp(.92rem,3.9vw,1.08rem);font-weight:600;
  background:#fff;border:2px solid var(--board-bg-2);border-radius:10px;cursor:pointer;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:background .14s,border-color .14s;}
.tile.picked{background:#e8f6ec;border-color:var(--pen-green);color:var(--pen-green);cursor:default;}
.tile.faded{opacity:.3;cursor:default;}
/* a wrong pick: shake and blink red twice, alongside the phone's own buzz */
.tile.wrong{animation:wrongpick .62s ease-in-out;}
@keyframes wrongpick{
  0%{transform:translateX(0);background:#fff;border-color:var(--board-bg-2);color:var(--ink);}
  12%{transform:translateX(-7px);background:#fdd9d3;border-color:var(--red-pen);color:var(--red-pen-dark);}
  30%{transform:translateX(7px);background:#fff;border-color:var(--board-bg-2);color:var(--ink);}
  48%{transform:translateX(-6px);background:#fdd9d3;border-color:var(--red-pen);color:var(--red-pen-dark);}
  66%{transform:translateX(6px);background:#fff;border-color:var(--board-bg-2);color:var(--ink);}
  82%{transform:translateX(-3px);background:#fdd9d3;border-color:var(--red-pen);color:var(--red-pen-dark);}
  100%{transform:translateX(0);background:#fff;border-color:var(--board-bg-2);color:var(--ink);}
}
.reading-note{color:var(--chalk);opacity:.85;}
</style>
</head>
<body>
<div class="board"><div class="frame">
  <div class="title">Opisywanie domów</div>
  <div class="subtitle">Wybierz właściwe słowo.</div>
  <div class="statusbar">
    <span id="score">Zdanie 1 / 10</span>
    <span id="reading" class="reading-note" hidden>Czytam…</span>
    <label class="sound-toggle"><input type="checkbox" id="soundChk" checked> dźwięk</label>
  </div>

  <div class="card" id="card">
    <div class="num" id="num"></div>
    <div class="sentence" id="sentence"></div>
    <div class="tiles" id="tiles"></div>
  </div>

  <div class="done" id="done" hidden>Brawo!</div>
  <div class="actions"><button class="btn secondary" id="againBtn">Od nowa</button></div>
</div></div>
<script>
/* Present Simple — Choose the Correct Tile (23), one sentence at a time.
   The same mechanic as U1-Rules-23 but paced one item per screen: the sentence
   is read once the right word is picked, and the next only appears when that
   reading has ENDED, so it is never talked over.

   A wrong pick shakes and blinks the tile red and buzzes the phone. It costs
   nothing else — the student simply picks the other tile. */
/* `before` + the chosen word + `after` is the whole sentence; `en` is that
   sentence written out, and `say` overrides it for the voice where the text
   would be read wrongly ("8.45"). The four after the teacher's six follow the
   same pattern. EVERY subject is a single word — no "My brother", no "The
   lessons": the point being drilled is the verb ending, and a two-word subject
   puts other things in the way of seeing it. */
const ITEMS = [
  {before:"There",             after:"a big garden.", right:"is", wrong:"are",
   en:"There is a big garden."},
  {before:"There",             after:"three bedrooms.", right:"are", wrong:"is",
   en:"There are three bedrooms."},
  {before:"There",             after:"some new furniture.", right:"is", wrong:"are",
   en:"There is some new furniture."},
  {before:"There",             after:"two big windows.", right:"are", wrong:"is",
   en:"There are two big windows."},
  {before:"Our house",         after:"four rooms.", right:"has", wrong:"is",
   en:"Our house has four rooms."},
  {before:"In the kitchen",    after:"a new cooker.", right:"there is", wrong:"it has",
   en:"In the kitchen there is a new cooker."},
  {before:"Our flat is close", after:"the station.", right:"to", wrong:"of",
   en:"Our flat is close to the station."},
  {before:"What I don't like", after:"the room is the colour.", right:"about", wrong:"for",
   en:"What I don't like about the room is the colour."},
  {before:"There is a lamp",   after:"the table.", right:"on", wrong:"in",
   en:"There is a lamp on the table."},
  {before:"The problem",       after:"my bedroom is that it's dark.", right:"with", wrong:"at",
   en:"The problem with my bedroom is that it's dark."}
];
/* ---------------- voices (§5.4: British English, male first) ---------------- */
let maleVoice=null, femaleVoice=null, englishVoice=null;
function refreshVoices(){
  const all = speechSynthesis.getVoices();
  /* British English: the course teaches BrE ("maths", not "math"). Setting
     utterance.lang alone is not enough — a voice object wins over it — so the
     male/female pick is made from en-GB voices first, falling back to any
     English voice, then to whatever the device has. */
  const gb = all.filter(v => /^en[-_]GB/i.test(v.lang || ''));
  const en = all.filter(v => /^en/i.test(v.lang || ''));
  /* English voices only. Never fall back to `all`: on a Polish tablet that
     hands English text to a Polish voice, which reads "do" as the Polish word. */
  const voices = gb.length ? gb : en;
  maleVoice = voices.find(v => /male/i.test(v.name) && !/female/i.test(v.name)) || null;
  femaleVoice = voices.find(v => /female/i.test(v.name)) || null;
  /* Most Android voices are named like "en-gb-x-rjs-local" — no "male" or
     "female" anywhere — so the two above come out null and nothing would be
     assigned, leaving the engine on the DEVICE DEFAULT, which is Polish here.
     This is the voice used whenever the gendered pick finds nothing. */
  englishVoice = voices[0] || null;
}
if('speechSynthesis' in window){ refreshVoices(); speechSynthesis.onvoiceschanged = refreshVoices; }
let speakCount = 0;
/* `onDone` fires when the reading has actually finished, so the exercise can
   wait for it instead of guessing a delay. Called exactly once and always —
   sound off, no speech support, and the Android builds where `onend` never
   arrives (hence the safety timer), otherwise the exercise would hang. */
function speak(text, onDone){
  let fired = false;
  const done = ()=>{ if(!fired){ fired = true; if(onDone) onDone(); } };
  if(!('speechSynthesis' in window) || !document.getElementById('soundChk').checked){
    setTimeout(done, 300);
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-GB';
  const odd = (++speakCount % 2 === 1);
  /* Setting `voice` throws if the object is not a live SpeechSynthesisVoice —
     which happens on Android when the voice list is rebuilt under us. Losing
     the chosen voice is survivable; losing the reading is not, because the
     exercise waits for it. */
  try {
    if(maleVoice && femaleVoice){ u.voice = odd ? maleVoice : femaleVoice; }
    else if(maleVoice){ u.voice = maleVoice; }
    else if(englishVoice){ u.voice = englishVoice; }
  } catch(e){ /* stay on the device default */ }
  if(!(maleVoice && femaleVoice)) u.pitch = odd ? 0.8 : 1.2;
  u.onend = done;
  u.onerror = done;
  /* Safety net for the Android builds where `onend` never arrives. Scaled to
     the text rather than a flat number: a freeze the length of a long sentence
     is survivable, twelve seconds on every word is not. */
  setTimeout(done, Math.min(8000, 1200 + text.length * 90));
  try { speechSynthesis.speak(u); } catch(e){ done(); }
}
function shuffled(n){
  const a = [...Array(n).keys()];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

const cardEl  = document.getElementById('card');
const numEl   = document.getElementById('num');
const sentEl  = document.getElementById('sentence');
const tilesEl = document.getElementById('tiles');
const scoreEl = document.getElementById('score');
const doneEl  = document.getElementById('done');
const readingEl = document.getElementById('reading');

let order = [], step = 0, busy = false;

/* A short buzz on a wrong pick. Not every device has a motor and some browsers
   ignore it outright, so it can only ever be a bonus on top of the visual. */
function buzz(){
  try { if(navigator.vibrate) navigator.vibrate([35, 45, 35]); } catch(e){}
}

function start(){
  /* All of them come up in a random order. Which of the two tiles holds the
     right answer is drawn at random too — that is position within an item,
     separate from the order of the set. */
  order = shuffled(ITEMS.length);
  step = 0; busy = false;
  doneEl.hidden = true;
  cardEl.hidden = false;
  readingEl.hidden = true;
  show();
}

function show(){
  if(step >= order.length){ finish(); return; }
  const it = ITEMS[order[step]];
  busy = false;
  cardEl.classList.remove('ok');
  numEl.textContent = 'Zdanie ' + (step + 1) + ' / ' + ITEMS.length;
  scoreEl.textContent = 'Zdanie ' + (step + 1) + ' / ' + ITEMS.length;

  sentEl.innerHTML = '';
  const blank = document.createElement('span');
  blank.className = 'blank';
  blank.id = 'blank';
  blank.textContent = '?';
  // the gap can open the sentence ("Do your parents…"), so only prepend when
  // there is something before it
  if(it.before) sentEl.append(it.before + ' ');
  sentEl.append(blank, ' ' + it.after);

  tilesEl.innerHTML = '';
  // the two options are offered in a random order, so the right one is not
  // always on the same side
  const pair = Math.random() < 0.5 ? [it.right, it.wrong] : [it.wrong, it.right];
  pair.forEach(word=>{
    const t = document.createElement('div');
    t.className = 'tile';
    t.textContent = word;
    t.addEventListener('click', ()=> pick(t, word, it, blank));
    tilesEl.appendChild(t);
  });
}

function pick(tile, word, it, blank){
  if(busy || cardEl.classList.contains('ok')) return;
  if(word !== it.right){
    buzz();
    tile.classList.remove('wrong'); void tile.offsetWidth; tile.classList.add('wrong');
    setTimeout(()=> tile.classList.remove('wrong'), 700);
    return;
  }
  busy = true;
  cardEl.classList.add('ok');
  blank.textContent = word;
  tile.classList.add('picked');
  [...tilesEl.children].forEach(o=>{ if(o !== tile) o.classList.add('faded'); });
  step++;
  readingEl.hidden = false;
  // read the finished sentence, and only then bring up the next one
  speak(it.say || it.en, ()=>{
    readingEl.hidden = true;
    setTimeout(show, 400);
  });
}

function finish(){
  cardEl.hidden = true;
  readingEl.hidden = true;
  scoreEl.textContent = 'Zdanie ' + ITEMS.length + ' / ' + ITEMS.length;
  doneEl.hidden = false;
  doneEl.textContent = 'Brawo! Wszystkie zdania.';
}

document.getElementById('againBtn').addEventListener('click', start);
start();
</script>
</body>
</html>
