<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>High Note 3 · Present Simple / Continuous — e-mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --board-bg:#6b3a28; --board-bg-2:#8a4f34; --board-frame:#4a3324; --board-frame-dark:#2e2016;
  --chalk:#f5ead9; --card-bg:#fdfaf3; --card-line:#e6dcc8; --ink:#2b2b26; --ink-soft:#78766a;
  --red-pen:#d1483a; --pen-green:#4f8f5e;
  --font-display:'Kalam',cursive; --font-body:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{
  margin:0; padding:0 14px 40px; font-family:var(--font-body); color:var(--chalk);
  background:linear-gradient(160deg,var(--board-bg),var(--board-bg-2)); background-attachment:fixed;
  min-height:100vh; -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px; margin:0 auto}   /* phone-first is not unbounded (§6) */

.title{
  font-family:var(--font-display); font-size:26px; font-weight:700; text-align:center;
  margin:14px 0 4px; line-height:1.15;
}
.sub{text-align:center; font-size:13px; color:#e7d6bf; margin:0 0 10px}

/* the bar is STICKY, not merely above the text: the gaps run the whole length
   of the e-mail, so a bar that scrolled away would take Pomoc with it — and it
   must stay above the box being typed into, where the keyboard cannot cover it */
.bar{
  position:sticky; top:0; z-index:5; display:flex; gap:8px; align-items:center;
  justify-content:center; flex-wrap:wrap;
  padding:8px 0 10px; margin:0 -14px; padding-left:14px; padding-right:14px;
  background:linear-gradient(180deg,rgba(107,58,40,.98) 72%,rgba(107,58,40,0));
}
.btn{
  font-family:var(--font-body); font-size:15px; font-weight:700; min-height:44px;
  padding:8px 16px; border-radius:10px; border:2px solid var(--board-frame-dark);
  background:var(--card-bg); color:var(--ink); cursor:pointer;
  box-shadow:0 2px 0 var(--board-frame-dark);
}
.btn:active{transform:translateY(2px); box-shadow:none}
.btn:disabled{opacity:.45; cursor:default; box-shadow:none}
.count{
  font-family:var(--font-mono); font-size:15px; min-height:44px; display:flex;
  align-items:center; padding:0 14px; border-radius:999px;
  background:rgba(0,0,0,.22); color:var(--chalk);
}
.count.reading{background:var(--board-frame-dark); font-family:var(--font-body); font-weight:700}

.letter{
  background:var(--card-bg); border:2px solid var(--board-frame); border-radius:14px;
  padding:16px 14px 18px; color:var(--ink); line-height:2.1; font-size:16px;
}
.head{font-family:var(--font-mono); font-size:14px; color:var(--ink-soft); line-height:1.6}
.letter p{margin:0 0 14px}
.letter p:last-child{margin-bottom:0}
.sign{font-family:var(--font-display); font-size:20px; font-weight:700}

.sent{border-radius:6px; padding:1px 0}
.sent.done{cursor:pointer}
.sent.reading{background:#fff5cf}

.gap{
  font-family:var(--font-mono); font-size:15px; font-weight:600; text-align:center;
  /* every gap is the SAME width, so the number of letters gives nothing away (§4.8) */
  width:14ch; min-height:34px; padding:2px 4px; vertical-align:baseline;
  border:0; border-bottom:2px solid var(--board-frame); border-radius:4px 4px 0 0;
  background:#fff; color:var(--ink);
}
/* a NEUTRAL focus ring, not the library's usual red one: with thirteen boxes
   on screen and red already meaning "that cannot become the answer", a red
   ring on the box you are typing into reads as a mistake you have not made */
.gap:focus{outline:3px solid rgba(74,51,36,.5); outline-offset:1px}
/* the blank and its bracket are one unit and must never be split across a
   line — a bracket stranded at the start of the next line belongs, to the eye,
   to whatever comes after it */
.slot{display:inline-block; white-space:nowrap}
.gap.bad{background:#fbe9e6; color:#8d2f24; border-bottom-color:var(--red-pen)}
.gap.good{background:#e9f4ec; color:#2f5f3c; border-bottom-color:var(--pen-green); font-weight:700}
.br{color:var(--pen-green); font-style:italic; font-size:14px; white-space:nowrap}

.done-card{
  margin-top:16px; background:var(--card-bg); border:2px solid var(--pen-green);
  border-radius:14px; padding:16px 14px; color:var(--pen-green);
  font-family:var(--font-display); font-size:24px; font-weight:700; text-align:center;
}
.done-card small{display:block; font-family:var(--font-body); font-size:13px;
  font-weight:400; color:var(--ink-soft); margin-top:4px}
.done-card .btn{margin-top:12px; color:var(--ink)}

body.busy .letter,
body.busy .btn{pointer-events:none}
noscript p{background:var(--card-bg); color:var(--ink); border-radius:10px; padding:12px;
  margin:12px 0; font-size:14px; text-align:center}
</style>
</head>
<body>

<div class="wrap">
  <h1 class="title">Uzupełnij e-mail</h1>
  <p class="sub">Present Simple czy Present Continuous?</p>

  <noscript><p>Ta strona potrzebuje JavaScriptu. Bez niego zobaczysz tylko tytuł i to zdanie —
  otwórz plik w przeglądarce z włączonym JavaScriptem.</p></noscript>

  <div class="bar">
    <button class="btn" id="help" type="button">Pomoc</button>
    <span class="count" id="count">0 / 13</span>
    <button class="btn" id="clear" type="button">Wyczyść</button>
  </div>

  <div class="letter" id="letter"></div>
  <p class="done-card" id="done" hidden></p>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   THE GAPS — canonical answer, the infinitive shown in brackets,
   and every other spelling that counts. Contracted and full forms
   both count (§4.4); the canonical is the FULL form, which is what
   the box shows back and what a Polish student needs to see.
   ============================================================ */
var GAPS = [
  {a:'am staying',   b:'(stay)',      alt:["'m staying", 'm staying']},
  {a:'am working',   b:'(work)',      alt:["'m working", 'm working']},
  {a:'sets',         b:'(set)',       alt:[]},
  {a:'work',         b:'(work)',      alt:[]},
  {a:'are working',  b:'(work)',      alt:["'re working", 're working']},
  {a:"don't work",   b:'(not work)',  alt:['do not work', 'dont work']},
  {a:'assist',       b:'(assist)',    alt:[]},
  {a:'are designing',b:'(design)',    alt:["'re designing", 're designing']},
  {a:'shows',        b:'(show)',      alt:[]},
  {a:'are wearing',  b:'(wear)',      alt:["'re wearing", 're wearing']},
  {a:'wears',        b:'(wear)',      alt:[]},
  {a:'looks',        b:'(look)',      alt:[]},
  {a:'Are you having', b:'(you/have)', alt:['are you having']}
];

/* The e-mail, split into SENTENCES — a sentence is what gets read aloud, and
   it is only read once every gap inside it is filled, or the reading would
   run straight over a blank. `t` is plain text, `g` is a gap by index. */
var SENTENCES = [
  {p:1, x:[{t:'Hi Dave!'}]},

  {p:2, x:[{t:'Guess what?'}]},
  {x:[{t:"I've won a fashion magazine competition!"}]},
  {x:[{t:'I '},{g:0},{t:' in London now and I '},{g:1},
      {t:' as a trainee for a fashion magazine which '},{g:2},{t:' the trends.'}]},
  {x:[{t:"Sounds exciting, doesn't it?"}]},
  {x:[{t:'I usually '},{g:3},{t:" only four hours a day but this week it's London Fashion Week so we "},
      {g:4},{t:' full time.'}]},
  {x:[{t:'Well, you know I '},{g:5},{t:' on the texts at my job but I often '},{g:6},
      {t:' with photo shoots.'}]},
  {x:[{t:'At the moment, we '},{g:7},{t:" the cover of next month's issue."}]},
  {x:[{t:'The cover '},{g:8},{t:' a young girl in a floral dress.'}]},
  {x:[{t:"You wouldn't believe how many girls and women in the streets "},{g:9},{t:' them now!'}]},
  {x:[{t:'My boss is an elderly man and his outfits are always very formal and elegant.'}]},
  {x:[{t:'He never '},{g:10},{t:' casual clothes to work.'}]},
  {x:[{t:'But you should see him now – he '},{g:11},{t:' so overdressed in his designer silk suit!'}]},

  {p:3, x:[{t:"That's all for now."}]},
  {x:[{g:12},{t:' a good time in Barcelona?'}]}
];

/* ============================================================
   VOICES (§5.4) — en-GB first, English only, never the whole list
   ============================================================ */
var SPOKEN = {};
function spoken(t){ return SPOKEN[t] || t; }

var maleVoice=null, femaleVoice=null, englishVoice=null;
function refreshVoices(){
  var all=[];
  try{ all = (window.speechSynthesis && speechSynthesis.getVoices()) || []; }catch(e){ all=[]; }
  var gb = all.filter(function(v){ return /^en[-_]GB/i.test(v.lang||''); });
  var en = all.filter(function(v){ return /^en/i.test(v.lang||''); });
  var voices = gb.length ? gb : en;
  englishVoice = voices[0] || null;
  maleVoice = voices.filter(function(v){ return /male/i.test(v.name) && !/female/i.test(v.name); })[0] || null;
  femaleVoice = voices.filter(function(v){ return /female/i.test(v.name); })[0] || null;
}
refreshVoices();
try{ if(window.speechSynthesis) speechSynthesis.onvoiceschanged = refreshVoices; }catch(e){}

var soundOn = true;

/* ONE VOICE throughout, and it is Clare's. §5.4's odd/even alternation is for
   a list of unrelated sentences; this is a single letter by a single writer,
   and alternating mid-e-mail would make it sound like two people wrote it —
   the §4.9 dialogue rule, applied to a text with one speaker. With no female
   voice on the device, a single steady pitch does the same job. */
function speak(text, onDone){
  var done = false;
  function fire(){ if(done) return; done = true; try{ onDone && onDone(); }catch(e){} }
  if(!soundOn || !text){ setTimeout(fire, 0); return; }
  var synth = null;
  try{ synth = window.speechSynthesis || null; }catch(e){ synth = null; }
  if(!synth || typeof SpeechSynthesisUtterance === 'undefined'){ setTimeout(fire, 0); return; }
  try{ synth.cancel(); }catch(e){}
  var u;
  try{ u = new SpeechSynthesisUtterance(spoken(text)); }catch(e){ setTimeout(fire, 0); return; }
  u.lang = 'en-GB';
  var pick = femaleVoice || englishVoice;
  try{ if(pick) u.voice = pick; }catch(e){}      /* throws on Android when the list is rebuilt */
  if(!femaleVoice) u.pitch = 1.2;                /* her line is the high one (§5.4) */
  u.onend = fire;
  u.onerror = fire;
  setTimeout(fire, Math.min(8000, 1200 + String(text).length * 90));
  try{ synth.speak(u); }catch(e){ fire(); }
}

/* ============================================================
   STATE
   ============================================================ */
var solved = [];       // per gap
var shown  = [];       // letters Pomoc has given, per gap
var helpUsed = 0;
var busy = false;      // held while anything is being read
var inputs = [];       // the <input> per gap
var sentEls = [];      // the <span class="sent"> per sentence

var letterEl = document.getElementById('letter');
var countEl  = document.getElementById('count');
var helpBtn  = document.getElementById('help');
var clearBtn = document.getElementById('clear');
var doneEl   = document.getElementById('done');

function norm(s){
  /* trailing sentence punctuation is not part of the form being tested, and
     the apostrophe is a keyboard switch on a phone — both are forgiven */
  return String(s||'').trim().toLowerCase().replace(/\s+/g,' ').replace(/[.!?,;:]+$/,'');
}
function wants(i){ return [GAPS[i].a].concat(GAPS[i].alt || []).map(norm); }

/* ============================================================
   BUILD THE TEXT
   ============================================================ */
function build(){
  letterEl.textContent = '';
  inputs = []; sentEls = [];

  var head = document.createElement('p');
  head.className = 'head';
  head.appendChild(document.createTextNode('From: Clare'));
  head.appendChild(document.createElement('br'));
  head.appendChild(document.createTextNode('To: Dave'));
  letterEl.appendChild(head);

  var p = null;
  SENTENCES.forEach(function(s, si){
    if(s.p || !p){ p = document.createElement('p'); letterEl.appendChild(p); }
    else { p.appendChild(document.createTextNode(' ')); }

    var span = document.createElement('span');
    span.className = 'sent';
    span.setAttribute('data-s', si);
    s.x.forEach(function(part){
      if(part.t !== undefined){ span.appendChild(document.createTextNode(part.t)); return; }
      var i = part.g;
      var inp = document.createElement('input');
      inp.type = 'text'; inp.className = 'gap';
      inp.setAttribute('autocomplete','off'); inp.setAttribute('autocapitalize','off');
      inp.setAttribute('autocorrect','off'); inp.setAttribute('spellcheck','false');
      inp.setAttribute('aria-label', 'Luka ' + (i+1));
      inp.setAttribute('data-g', i);
      var slot = document.createElement('span');
      slot.className = 'slot';
      slot.appendChild(inp);
      slot.appendChild(document.createTextNode(' '));
      var br = document.createElement('i');
      br.className = 'br';
      br.textContent = GAPS[i].b;
      slot.appendChild(br);
      span.appendChild(slot);
      inputs[i] = inp;
    });
    /* a finished sentence can be tapped to hear it again — the answers are
       already on screen, so replaying gives nothing away (§4.2) */
    span.addEventListener('click', function(){
      if(busy || !sentenceReady(si)) return;
      readSentence(si);
    });
    sentEls[si] = span;
    p.appendChild(span);
  });

  var sign = document.createElement('p');
  sign.className = 'sign';
  sign.textContent = 'Clare';
  letterEl.appendChild(sign);

  inputs.forEach(function(inp, i){
    inp.addEventListener('input', function(){ typed(i); });
    inp.addEventListener('focus', function(){ focused = i; paint(); });
  });
}

var focused = 0;

/* ============================================================
   TYPING — a right form is taken on `input`, never behind a submit
   button: the phone keyboard covers anything below the field (§1)
   ============================================================ */
function typed(i){
  if(busy) return;
  var inp = inputs[i];
  if(solved[i]){ inp.value = GAPS[i].a; return; }   // locked by restoring the
                                                     // value, not by readOnly:
                                                     // that drops the keyboard
                                                     // and the next gap needs it
  var v = norm(inp.value);
  var list = wants(i);
  if(list.indexOf(v) >= 0){ lock(i); return; }
  /* neutral while it can still become ANY accepted form, red once it cannot.
     An empty box is never red. */
  var open = !v || list.some(function(x){ return x.indexOf(v) === 0; });
  inp.className = 'gap' + (open ? '' : ' bad');
}

function lock(i){
  solved[i] = true;
  inputs[i].value = GAPS[i].a;        // the canonical form, not the typing
  inputs[i].className = 'gap good';
  paint();
  /* the end card waits on the last reading FINISHING, never on a timer — a
     fixed delay would put it on screen over the top of the sentence (§4.7) */
  var last = solved.filter(Boolean).length === GAPS.length;
  var si = sentenceOf(i);
  if(sentenceReady(si)) readSentence(si, last ? -1 : next(i), last ? finish : null);
  else if(last) finish();
  else focus(next(i));
}

function next(i){
  for(var j = i + 1; j < GAPS.length; j++) if(!solved[j]) return j;
  for(var k = 0; k < GAPS.length; k++) if(!solved[k]) return k;
  return -1;
}
function focus(i){
  if(i < 0) return;
  focused = i;
  try{ inputs[i].focus(); }catch(e){}
  paint();
}

function sentenceOf(g){
  for(var s = 0; s < SENTENCES.length; s++){
    var hit = SENTENCES[s].x.some(function(p){ return p.g === g; });
    if(hit) return s;
  }
  return -1;
}
/* a sentence is read only when EVERY gap in it is filled — otherwise the
   reading would run straight over a blank */
function sentenceReady(si){
  var gs = SENTENCES[si].x.filter(function(p){ return p.g !== undefined; });
  if(!gs.length) return false;
  return gs.every(function(p){ return solved[p.g]; });
}
function sentenceText(si){
  return SENTENCES[si].x.map(function(p){
    return p.t !== undefined ? p.t : GAPS[p.g].a;
  }).join('').replace(/–/g, ',');   /* the dash is a pause, not a word */
}

/* ============================================================
   READING — the board is held for the whole of it (§4.7)
   ============================================================ */
function hold(){
  busy = true;
  document.body.classList.add('busy');
  countEl.className = 'count reading';
  countEl.textContent = 'Czytam…';
}
function release(){
  busy = false;
  document.body.classList.remove('busy');
  countEl.className = 'count';
  paint();
}
function readSentence(si, focusAfter, after){
  hold();
  sentEls[si].classList.add('reading');
  speak(sentenceText(si), function(){
    sentEls[si].classList.remove('reading');
    release();
    /* the focus move happens after the reading; on a phone the keyboard
       follows the focus, which is why the next gap is chosen here */
    if(focusAfter !== undefined) focus(focusAfter);
    if(after) after();
  });
}
/* the whole e-mail, one sentence at a time, chained on `onDone` and never on a
   timer — a fixed delay would talk over the previous sentence (§4.7) */
function readAll(){
  var order = [];
  for(var s = 0; s < SENTENCES.length; s++) order.push(s);
  hold();
  (function step(k){
    if(k >= order.length){ release(); return; }
    var si = order[k];
    sentEls[si].classList.add('reading');
    speak(sentenceText(si), function(){
      sentEls[si].classList.remove('reading');
      step(k + 1);
    });
  })(0);
}

/* ============================================================
   POMOC — one more letter of the gap in hand, written INTO the box
   so the student carries on from there (§4.6). What is already
   right is kept, the first wrong letter is overwritten, and
   everything after it goes: a hint can never sit behind a mistake.
   ============================================================ */
helpBtn.addEventListener('click', function(){
  if(busy) return;
  var i = solved[focused] ? next(focused) : focused;
  if(i < 0) return;
  focused = i;
  var want = GAPS[i].a;
  var have = inputs[i].value;
  var keep = 0;
  while(keep < have.length && keep < want.length &&
        have.charAt(keep).toLowerCase() === want.charAt(keep).toLowerCase()) keep++;
  shown[i] = Math.max((shown[i] || 0), keep) + 1;
  if(shown[i] > want.length) shown[i] = want.length;
  helpUsed++;
  inputs[i].value = want.slice(0, shown[i]);
  typed(i);
  if(!solved[i]) try{ inputs[i].focus(); }catch(e){}
  paint();
});

clearBtn.addEventListener('click', function(){
  if(busy) return;
  start();
});

function paint(){
  var n = solved.filter(Boolean).length;
  if(!busy){ countEl.textContent = n + ' / ' + GAPS.length; }
  helpBtn.disabled = busy || n === GAPS.length;
  clearBtn.disabled = busy;
  sentEls.forEach(function(el, si){
    el.classList.toggle('done', sentenceReady(si));
  });
}

function finish(){
  doneEl.textContent = '';
  doneEl.hidden = false;
  doneEl.appendChild(document.createTextNode('Brawo! 🎉'));
  var s = document.createElement('small');
  s.textContent = helpUsed ? ('Pomoc: ' + helpUsed + ' ×') : 'Bez podpowiedzi!';
  doneEl.appendChild(s);
  var b = document.createElement('button');
  b.type = 'button'; b.className = 'btn';
  b.textContent = 'Przeczytaj cały e-mail';
  b.addEventListener('click', function(){ if(!busy) readAll(); });
  doneEl.appendChild(b);
}

function start(){
  solved = []; shown = []; helpUsed = 0; focused = 0;
  busy = false;
  document.body.classList.remove('busy');
  doneEl.hidden = true;
  doneEl.textContent = '';
  countEl.className = 'count';
  build();
  paint();
}

start();

/* exposed for the automated checks only */
window.__ex = {
  gaps: function(){ return GAPS; },
  sentences: function(){ return SENTENCES; },
  text: sentenceText,
  inputs: function(){ return inputs; },
  isBusy: function(){ return busy; },
  type: function(i, v){ inputs[i].value = v; inputs[i].dispatchEvent(new Event('input')); },
  focus: function(i){ focused = i; },
  help: function(){ helpBtn.click(); },
  clear: function(){ clearBtn.click(); },
  solved: function(){ return solved.slice(); },
  readAll: readAll
};
})();
</script>
</body>
</html>
